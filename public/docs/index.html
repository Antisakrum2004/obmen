<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payroll Review API — Swagger UI</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>
  .topbar { display: none; }
  .swagger-ui .info .title { font-size: 24px; }
  body { background: #fafafa; }
</style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
SwaggerUIBundle({
  url: '/docs/openapi.yaml',
  dom_id: '#swagger-ui',
  presets: [
    SwaggerUIBundle.presets.apis,
    SwaggerUIBundle.SwaggerUIStandalonePreset
  ],
  layout: 'BaseLayout',
  defaultModelsExpandDepth: 2,
  defaultModelExpandDepth: 2,
  docExpansion: 'list',
  tryItOutEnabled: true,
  requestInterceptor: function(req) {
    /* Подставляем API-ключ по умолчанию */
    if (!req.url.includes('key=') && !req.headers['X-API-Key']) {
      var sep = req.url.includes('?') ? '&' : '?';
      req.url += sep + 'key=pr_api_2026';
    }
    return req;
  }
});
</script>
</body>
</html>
